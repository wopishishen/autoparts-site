<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>内容管理 - 汽车配件独立站</title>
  <meta name="robots" content="noindex, nofollow" />
</head>
<body>
  <!-- 修复 Decap CMS 3.17.1 bug：getFileSha 用 encodeURIComponent 编码子目录路径，把 / 变成 %2F，
       导致 GitHub API extended SHA-1 语法 <branch>:<path> 返回 404，readFile catch 吞错返回空串，
       最终 JSON.parse('') 报错。全局 patch 让 encodeURIComponent 不编码路径分隔符 /。 -->
  <script>
    (function() {
      var orig = window.encodeURIComponent;
      window.encodeURIComponent = function(str) {
        return orig(str).replace(/%2F/g, '/');
      };
    })();
  </script>
  <!-- Decap CMS 管理后台入口（本地打包文件，不依赖外部 CDN） -->
  <script src="./vendor/decap-cms.js"></script>
  <!-- 简体中文语言包 -->
  <script src="./vendor/zh_Hans.js"></script>
  <script>
    CMS.registerLocale('zh_Hans', window.zh_Hans);
  </script>
</body>
</html>
