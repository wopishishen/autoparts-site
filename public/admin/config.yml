# Decap CMS 配置 —— 汽车配件独立站内容管理
# 部署前需替换 repo / app_id 为真实值（见部署说明）

# 本地开发模式：运行 `npx decap-server` 后，/admin/ 免登录直接编辑，内容写入本地文件
local_backend: true

# 界面语言：简体中文（运营人员使用）
locale: zh_Hans

# 预览链接前缀（开发环境，部署后改为线上域名）
preview_url: http://localhost:3000

backend:
  name: github
  repo: wopishishen/autoparts-site   # ← 推送前替换为你的 GitHub 账号/仓库名
  branch: main
  # GitHub App 认证（Implicit Grant），无需自建 OAuth 服务器
  app_id: YOUR_GITHUB_APP_ID                  # ← 部署前创建 GitHub App 后替换
  auth_endpoint: https://github.com/login/oauth/authorize
  auth_scope: repo

media_folder: public/images
public_folder: /images

collections:
  - name: products
    label: 商品管理
    label_singular: 商品
    folder: content/products
    extension: json
    format: json
    create: true
    delete: true
    slug: "{{slug}}"
    summary: "{{name}}"
    identifier_field: name
    sortable_fields: [name, published, featured]
    preview_path: products/{{slug}}
    fields:
      - { label: "Slug（URL 标识，小写连字符，如 golden-dragon-bus-parts）", name: slug, widget: string, hint: "商品详情页 URL：/products/<slug>" }
      - { label: "商品名称", name: name, widget: string }
      - { label: "型号 / 适配车型", name: model, widget: string, required: false }
      - { label: "一句话卖点（列表页显示）", name: summary, widget: text, required: false }
      - { label: "商品详情（正文）", name: description, widget: markdown, required: false }
      - label: "商品图片"
        name: images
        widget: list
        field: { label: 图片, name: image, widget: image }
        required: false
      - label: "系统分类"
        name: category
        widget: select
        options:
          - { label: 发动机配件, value: engine-parts }
          - { label: 底盘配件, value: chassis-parts }
          - { label: 变速箱配件, value: gearbox-parts }
          - { label: 车身配件, value: body-parts }
          - { label: 制动配件, value: brake-parts }
          - { label: 电器配件, value: electric-parts }
          - { label: 新能源配件, value: new-energy-parts }
        required: false
      - label: "适配品牌（可多选）"
        name: brands
        widget: list
        field:
          label: 品牌
          name: brand
          widget: select
          options:
            - { label: 海格 Higer, value: higer }
            - { label: 中通 Zhongtong, value: zhongtong }
            - { label: 金龙 Golden Dragon, value: golden-dragon }
            - { label: 宇通 Kinglong, value: kinglong }
            - { label: 安凯 Ankai, value: ankai }
            - { label: 福田 Foton, value: foton }
            - { label: 亚星 Asiastar, value: asiastar }
            - { label: 比亚迪 BYD, value: byd }
        required: false
      - label: "标签"
        name: tags
        widget: list
        field: { label: 标签, name: tag, widget: string }
        required: false
      - label: "产品参数表"
        name: params
        widget: object
        fields:
          - { label: "产品名称", name: productName, widget: string, required: false }
          - { label: "尺寸规格", name: size, widget: string, required: false }
          - { label: "材质", name: materials, widget: text, required: false }
          - { label: "最小起订量 MOQ", name: moq, widget: string, required: false }
          - { label: "交货周期", name: deliveryTime, widget: string, required: false }
          - { label: "运输方式", name: deliveryMethod, widget: text, required: false }
        required: false
      - { label: "首页精选推荐", name: featured, widget: boolean, default: false }
      - { label: "上架显示", name: published, widget: boolean, default: true }
      - label: "SEO 优化"
        name: seo
        widget: object
        required: false
        fields:
          - { label: "页面标题（留空则用商品名）", name: title, widget: string, required: false }
          - { label: "页面描述（留空则用一句话卖点）", name: description, widget: text, required: false }

  - name: categories
    label: 分类管理
    label_singular: 分类
    folder: content/categories
    extension: json
    format: json
    create: true
    delete: true
    slug: "{{slug}}"
    summary: "{{name}}"
    identifier_field: name
    sortable_fields: [name]
    fields:
      - { label: "Slug（URL 标识）", name: slug, widget: string }
      - { label: "分类名称", name: name, widget: string }
      - { label: "分类描述", name: description, widget: text, required: false }
      - { label: "分类封面图", name: image, widget: image, required: false }
      - label: "SEO 优化"
        name: seo
        widget: object
        required: false
        fields:
          - { label: "页面标题", name: title, widget: string, required: false }
          - { label: "页面描述", name: description, widget: text, required: false }

  - name: site
    label: 站点设置
    files:
      - file: content/site.json
        label: "站点配置（品牌 / 联系方式）"
        name: site
        fields:
          - { label: "品牌名称", name: brandName, widget: string }
          - { label: "Logo 文字", name: brandLogoText, widget: string }
          - { label: "公司名称", name: companyName, widget: string }
          - { label: "品牌标语", name: tagline, widget: string }
          - label: "联系方式"
            name: contact
            widget: object
            fields:
              - { label: "电话", name: tel, widget: string }
              - { label: "邮箱（询盘接收）", name: email, widget: string }
              - { label: "WhatsApp", name: whatsapp, widget: string }
              - { label: "微信", name: wechat, widget: string }
              - { label: "Skype", name: skype, widget: string }
              - { label: "地址", name: address, widget: string }
          - label: "SEO 优化"
            name: seo
            widget: object
            fields:
              - { label: "默认页面标题", name: defaultTitle, widget: string }
              - { label: "默认页面描述", name: defaultDescription, widget: text }
              - { label: "社交分享图", name: ogImage, widget: image, required: false }
